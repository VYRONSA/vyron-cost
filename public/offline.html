<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07111F" />
  <title>VYRON COST Offline</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 12% 15%, rgba(7,17,31,0.14), transparent 35%), radial-gradient(circle at 86% 8%, rgba(199,154,43,0.2), transparent 32%), linear-gradient(180deg, #f8fafd 0%, #e9eff7 100%);
      font-family: "SF Pro Display", "Avenir Next", "Segoe UI", sans-serif;
      color: #0f172a;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(420px, 100%);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 28px;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 24px 52px rgba(12,23,41,0.15);
      padding: 28px;
    }
    .badge {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid #f3d58a;
      background: #fff7e4;
      color: #a87a17;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
      padding: 7px 10px;
    }
    h1 {
      margin: 14px 0 8px;
      font-size: 32px;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }
    p {
      margin: 0;
      color: #475569;
      font-weight: 600;
      line-height: 1.55;
    }
    .action {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border-radius: 14px;
      border: 1px solid #d8b24a;
      background: #fff1cc;
      color: #7a580c;
      font-weight: 800;
      padding: 0 16px;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Offline</span>
    <h1>VYRON COST</h1>
    <p>You are currently offline. Cached app assets are still available. Reconnect to resume live data and workspace updates.</p>
    <a class="action" href="/dashboard">Retry</a>
  </main>
</body>
</html>
