<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070213"/>
      <stop offset=".34" stop-color="#3b0d72"/>
      <stop offset=".68" stop-color="#13051f"/>
      <stop offset="1" stop-color="#05020b"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fb923c"/>
      <stop offset=".52" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="orangeGlow">
      <stop stop-color="#fb923c" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fb923c" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow">
      <stop stop-color="#2dd4bf" stop-opacity=".64"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="2000" height="1100" rx="70" fill="url(#bg)"/>
